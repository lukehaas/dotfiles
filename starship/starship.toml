# General
command_timeout = 2000
# Theme: the `theme` command sets the palette ("catppuccin_mocha" or
# "e_ink") in a generated copy of this file, so leave this as the default.
palette = "catppuccin_mocha"

format = """
$directory\
$git_branch\
${custom.git_state}\
$nodejs\
$python\
$rust\
$docker_context\
$line_break\
$character"""

# Prompt character
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

# Directory
[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 0
truncate_to_repo = false
style = "bold mauve"

# Git
[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style)"
symbol = " "
style = "bold blue"

[git_status]
disabled = true

# One git status per prompt: ✖ when dirty, ● when clean. The colour comes
# from the command, since a module's style can't depend on its output. Plain
# ANSI red and green, so it follows the terminal's colour scheme.
[custom.git_state]
command = 'if [ -n "$(git status --porcelain 2>/dev/null)" ]; then printf "\033[1;31m✖\033[0m"; else printf "\033[1;32m●\033[0m"; fi'
when = true
require_repo = true
shell = ["sh"]
format = " $output"

[git_metrics]
disabled = true

# Node.js
[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"

# Python
[python]
symbol = " "
format = "[$symbol($version )]($style)"

# Docker
[docker_context]
symbol = " "
format = "[$symbol$context]($style)"

[aws]
disabled = true

[gcloud]
disabled = true

[java]
disabled = true

[ruby]
disabled = true

[php]
disabled = true

[golang]
disabled = true

[kotlin]
disabled = true

[swift]
disabled = true

[terraform]
disabled = true


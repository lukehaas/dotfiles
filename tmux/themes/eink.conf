# E-Ink colours for catppuccin, for the Bigme B13. Same values as the e_ink
# palette in starship.toml. Set before the plugin loads, so they take the
# place of the flavor's own.
set -g @thm_bg "#ffffff"
set -g @thm_fg "#000000"

set -g @thm_rosewater "#d75f00"
set -g @thm_flamingo "#d70000"
set -g @thm_pink "#b000b0"
set -g @thm_mauve "#b000b0"
set -g @thm_red "#d70000"
set -g @thm_maroon "#d70000"
set -g @thm_peach "#d75f00"
set -g @thm_yellow "#b07000"
set -g @thm_green "#008f00"
set -g @thm_teal "#008ca0"
set -g @thm_sky "#008ca0"
set -g @thm_sapphire "#0050e0"
set -g @thm_blue "#0050e0"
set -g @thm_lavender "#0050e0"

set -g @thm_subtext_1 "#333333"
set -g @thm_subtext_0 "#333333"
set -g @thm_overlay_2 "#333333"
set -g @thm_overlay_1 "#555555"
set -g @thm_overlay_0 "#777777"
set -g @thm_surface_2 "#999999"
set -g @thm_surface_1 "#bbbbbb"
set -g @thm_surface_0 "#dddddd"
set -g @thm_mantle "#ffffff"
set -g @thm_crust "#ffffff"

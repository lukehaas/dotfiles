# Terminal settings
set-option -sa terminal-overrides ",xterm*:RGB"
set -g default-terminal "tmux-256color"
set -g mouse on
set -g allow-passthrough on
set -g escape-time 0
set -g set-clipboard on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -ga terminal-features ",*:hyperlinks"

# Prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Key bindings
bind r command-prompt -p "rename window:" "rename-window '%%' \; set-window-option automatic-rename off"
bind R source-file ~/.config/tmux/tmux.conf
bind ^l refresh-client
bind x confirm-before -y -p "kill-pane #P? (Y/n)" kill-pane

# Window settings
set-option -g allow-rename off
set -g automatic-rename on
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# Catppuccin settings (BEFORE plugin loads)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_background "none"

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Status bar (AFTER plugin loads)
set -g status-position top
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_directory}"

# Vi mode and copy bindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Splits
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# Initialize TPM (keep at very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
